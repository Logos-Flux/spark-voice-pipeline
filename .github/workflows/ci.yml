name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install lint tooling
        run: |
          python -m pip install --upgrade pip
          # Pinned: unpinned installs drift CI green/red independent of code
          # changes (ruff 0.16.x flags BLE001/E001/etc. on this tree).
          pip install "ruff==0.15.6" "black==26.5.0"

      - name: Run ruff
        run: ruff check .

      - name: Run black
        run: black --check .
